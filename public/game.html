<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Game - Skribbl</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- GAME HEADER -->
  <div class="game-header">
    <div class="header-row header-top-row">
      <button class="back-btn" onclick="goBack()" title="Leave Game">←</button>
      <span class="round-info" id="roundInfo">Round ?/?</span>
      <div class="timer-display" id="timerWrap">⏳ <span id="timer">0</span>s</div>
      <div class="header-section">
        <span id="status">Waiting...</span>
        <span class="drawer-label">✏️ <span id="drawerName">---</span></span>
      </div>
    </div>
    <div class="header-row header-word-row">
      <div id="wordDisplay">SKRIBBL</div>
    </div>
  </div>

  <!-- GAME LAYOUT -->
  <div class="game-layout">

    <!-- Left: Scoreboard -->
    <div class="scoreboard" id="scoreboard">
      <div class="scoreboard-title">Players</div>
    </div>

    <!-- Center: Canvas -->
    <div class="canvas-wrap">
      <canvas id="canvas" width="800" height="600"></canvas>

      <!-- Drawing Tools -->
      <div id="tools">
        <!-- Colors Row -->
        <div class="tools-row" id="colorRow">
          <div class="color-btn active" style="background:#000" onclick="setColor('#000')" data-color="#000"></div>
          <div class="color-btn" style="background:#444" onclick="setColor('#444')" data-color="#444"></div>
          <div class="color-btn" style="background:#888" onclick="setColor('#888')" data-color="#888"></div>
          <div class="color-btn" style="background:#e74c3c" onclick="setColor('#e74c3c')" data-color="#e74c3c"></div>
          <div class="color-btn" style="background:#e67e22" onclick="setColor('#e67e22')" data-color="#e67e22"></div>
          <div class="color-btn" style="background:#f1c40f" onclick="setColor('#f1c40f')" data-color="#f1c40f"></div>
          <div class="color-btn" style="background:#2ecc71" onclick="setColor('#2ecc71')" data-color="#2ecc71"></div>
          <div class="color-btn" style="background:#1abc9c" onclick="setColor('#1abc9c')" data-color="#1abc9c"></div>
          <div class="color-btn" style="background:#3498db" onclick="setColor('#3498db')" data-color="#3498db"></div>
          <div class="color-btn" style="background:#9b59b6" onclick="setColor('#9b59b6')" data-color="#9b59b6"></div>
          <div class="color-btn" style="background:#e91e8f" onclick="setColor('#e91e8f')" data-color="#e91e8f"></div>
          <div class="color-btn" style="background:#795548" onclick="setColor('#795548')" data-color="#795548"></div>
          <div class="color-btn" style="background:#fff; border-color:#aaa;" onclick="setColor('#ffffff')" data-color="#ffffff"></div>
        </div>

        <!-- Tools Row -->
        <div class="tools-row">
          <span class="brush-size-label" id="brushLabel">3px</span>
          <input type="range" min="1" max="30" value="3" class="brush-size-slider" id="brushSlider"
            oninput="setBrushSize(this.value)" />

          <span class="tools-divider"></span>

          <button class="tool-btn" id="penBtn" onclick="selectPen()">✏️ Pen</button>
          <button class="tool-btn" id="eraserBtn" onclick="selectEraser()">🧹 Eraser</button>
          <button class="tool-btn" id="bucketBtn" onclick="selectBucket()">🪣 Fill</button>

          <span class="tools-divider"></span>

          <button class="tool-btn" id="undoBtn" onclick="undoLast()">↩️ Undo</button>
          <button class="tool-btn" onclick="clearCanvas()" style="color:#e74c3c;">🗑️ Clear</button>
        </div>
      </div>
    </div>

    <!-- Right: Chat -->
    <div class="chat-box">
      <div id="messages"></div>
      <div class="chat-input-wrap">
        <input id="chatInput" class="input" placeholder="Type your guess..." autocomplete="off" />
        <button class="chat-send-btn" id="sendBtn" onclick="sendChat()">➤</button>
      </div>
    </div>
  </div>

  <!-- Word Selection Popup -->
  <div id="wordChoices" class="word-choice-box"></div>

  <!-- Hidden room info -->
  <div id="roomInfo" style="display:none;"></div>

  <!-- Game Over Overlay -->
  <div id="gameOverOverlay" class="game-over-overlay">
    <div class="game-over-box">
      <h1>🏆 GAME OVER 🏆</h1>
      <div id="finalScoreboard" class="final-scoreboard"></div>
      <button class="btn" onclick="location.href='index.html'" style="margin-bottom:0.5rem;">Back to Home</button>
      <button class="btn btn-secondary" onclick="location.href='lobby.html'" style="font-size:1rem;">Play Again</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
