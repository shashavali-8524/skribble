<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Join Room - Skribbl</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="title">Join Room</h1>

  <div class="container">
    <div id="nameSection"></div>

    <label>Room Code</label>
    <input id="roomId" class="input" placeholder="Enter room code" maxlength="10"
      style="text-align: center; font-weight: bold; text-transform: uppercase; font-size: 1.4rem; letter-spacing: 4px;"
      autocomplete="off" />

    <div id="roomStatus" style="margin-bottom: 1rem; font-size: 0.9rem; min-height: 1.5em;"></div>

    <button class="btn" id="joinBtn" style="margin-bottom: 0.8rem;">Join Room</button>
    <button class="btn btn-secondary" style="font-size: 1rem;" onclick="location.href='index.html'">← Back</button>
  </div>

  <footer class="footer">Made by <a href="https://www.linkedin.com/in/shasha-vali-ab539428a/" target="_blank" rel="noopener">Shasha Vali</a></footer>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let TOKEN = localStorage.getItem("playerToken");
    if (!TOKEN) { TOKEN = crypto.randomUUID(); localStorage.setItem("playerToken", TOKEN); }

    const name = localStorage.getItem("playerName");
    const avatar = localStorage.getItem("playerAvatar") || "😐";
    const nameSection = document.getElementById("nameSection");

    if (name) {
      nameSection.innerHTML = `<h3 style="margin-bottom: 1rem; color: var(--secondary-color);">${avatar} ${name}</h3>`;
    } else {
      nameSection.innerHTML = `
        <label>Your Name</label>
        <input id="newPlayerName" class="input" placeholder="Enter your name" maxlength="20"
          style="text-align: center; font-weight: bold;" autocomplete="off" />
      `;
    }

    // Auto-fill room ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if (roomParam) {
      document.getElementById("roomId").value = roomParam.toUpperCase();
      checkRoom(roomParam);
    }

    // Live room check as user types
    let checkTimeout;
    document.getElementById("roomId").addEventListener("input", (e) => {
      e.target.value = e.target.value.toUpperCase();
      clearTimeout(checkTimeout);
      const val = e.target.value.trim();
      if (val.length >= 4) {
        checkTimeout = setTimeout(() => checkRoom(val), 300);
      } else {
        document.getElementById("roomStatus").innerHTML = "";
      }
    });

    function checkRoom(code) {
      socket.emit("checkRoom", { roomId: code }, (res) => {
        const el = document.getElementById("roomStatus");
        if (res.exists) {
          if (res.gameStarted) {
            el.innerHTML = `<span style="color: orange;">⚠️ Game in progress (${res.playerCount}/${res.maxPlayers})</span>`;
          } else {
            el.innerHTML = `<span style="color: green;">✅ Room found! (${res.playerCount}/${res.maxPlayers} players)</span>`;
          }
        } else {
          el.innerHTML = `<span style="color: red;">❌ Room not found</span>`;
        }
      });
    }

    document.getElementById("joinBtn").onclick = () => {
      let currentName = localStorage.getItem("playerName");

      if (!currentName) {
        const nameInput = document.getElementById("newPlayerName");
        if (nameInput) {
          currentName = nameInput.value.trim();
          if (currentName && currentName.length >= 2) {
            localStorage.setItem("playerName", currentName);
            localStorage.setItem("playerAvatar", "😐");
          }
        }
      }

      if (!currentName || currentName.length < 2) return alert("Please enter a valid name (2+ characters)");

      const roomId = document.getElementById("roomId").value.trim().toUpperCase();
      if (!roomId) return alert("Please enter a room code");

      const btn = document.getElementById("joinBtn");
      btn.disabled = true;
      btn.innerText = "Joining...";

      socket.emit("joinRoom", {
        roomId,
        name: currentName,
        avatar: localStorage.getItem("playerAvatar") || "😐",
        token: TOKEN
      }, (res) => {
        btn.disabled = false;
        btn.innerText = "Join Room";

        if (!res.ok) return alert(res.err || "Failed to join");
        if (res.token) localStorage.setItem("playerToken", res.token);
        localStorage.setItem("roomId", roomId);
        location.href = "lobby.html";
      });
    };

    // Enter key
    document.getElementById("roomId").addEventListener("keypress", (e) => {
      if (e.key === "Enter") document.getElementById("joinBtn").click();
    });
  </script>
</body>
</html>
